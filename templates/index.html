<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Purchase desk</title>
  <link rel="stylesheet" href="/static/app.css?v=24">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"><span>PO</span></span>
      <span>
        <span class="eyebrow">Cincinnati Valve</span>
        <h1 class="name">Purchase desk</h1>
      </span>
    </a>
    <div class="top-actions">
      <form method="post" action="/logout">
        <button type="submit" class="sheet-link">Log out</button>
      </form>
      <a class="sheet-link" id="sheet-link" href="{{ sheet_url }}" target="_blank" rel="noopener">
      Spreadsheet
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M3 11L11 3M11 3H5.5M11 3V8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      </a>
    </div>
  </header>

  <div class="shell">
    <section id="intake" aria-label="Choose a purchase order">
      <div class="intro">
        <h2>Add a purchase order</h2>
        <p>Read a PDF, check the lines, and create the order in Zoho Books.</p>
      </div>
      <div id="drop" class="drop">
        <input id="file" class="visually-hidden" type="file" accept="application/pdf,.pdf">
        <div class="drop-bar">
          <span class="drop-mark" aria-hidden="true">
            <svg width="22" height="26" viewBox="0 0 46 56" fill="none">
              <path d="M6 2.75h22.2L40.25 14.8V50a3.25 3.25 0 0 1-3.25 3.25H6A3.25 3.25 0 0 1 2.75 50V6A3.25 3.25 0 0 1 6 2.75z" stroke="currentColor" stroke-width="2.4"/>
              <path d="M28 2.75V15h12.25" stroke="currentColor" stroke-width="2.4"/>
              <path d="M12 28h22M12 36h22M12 44h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="drop-copy">
            <h2>Purchase order</h2>
            <p>Drop a PDF here, or choose a file.</p>
          </span>
          <button type="button" id="browse" class="primary">Choose a PDF</button>
        </div>
        <div class="drop-well" aria-hidden="true">
          <svg width="28" height="34" viewBox="0 0 46 56" fill="none">
            <path d="M6 2.75h22.2L40.25 14.8V50a3.25 3.25 0 0 1-3.25 3.25H6A3.25 3.25 0 0 1 2.75 50V6A3.25 3.25 0 0 1 6 2.75z" stroke="currentColor" stroke-width="2.2"/>
            <path d="M28 2.75V15h12.25" stroke="currentColor" stroke-width="2.2"/>
            <path d="M23 26v16M15 34h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div id="filebar" class="filebar" hidden>
        <div>
          <strong id="filename"></strong>
          <span id="filesize"></span>
        </div>
        <button type="button" id="clear-file" class="text">Remove</button>
      </div>

      <div id="read-row" class="read-row" hidden>
        <button type="button" id="read" class="primary">Read purchase order</button>
      </div>

      <div id="reader" class="reader" hidden>
        <div class="reader-sheet" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p>Reading the purchase order</p>
      </div>

      <div id="status" class="status" role="alert"></div>
    </section>

    <section id="review" hidden>
      <div class="workspace">
        <aside class="preview">
          <div class="preview-frame">
            <iframe id="pdf" title="Purchase order PDF"></iframe>
          </div>
        </aside>
        <form id="ledger-form" class="ledger">
          <div class="ledger-head">
            <h2>Review the lines <span id="count"></span></h2>
            <p id="summary" class="summary"></p>
          </div>

          <div id="order" class="order entry"></div>
          <div id="lines" class="lines"></div>

          <div class="ledger-tools">
            <button type="button" id="add-line" class="text">Add a line</button>
          </div>

          <div class="dock">
            <div class="dock-options">
              <div class="choices">
                <label class="choice">
                  <input id="to-sheet" type="checkbox" checked>
                  <span class="box" aria-hidden="true"></span>
                  <span class="choice-copy">
                    <span class="choice-title">Spreadsheet</span>
                    <span class="choice-help">Append these lines to the POs tab</span>
                  </span>
                </label>
                <label class="choice">
                  <input id="to-zoho" type="checkbox">
                  <span class="box" aria-hidden="true"></span>
                  <span class="choice-copy">
                    <span class="choice-title">Zoho Books</span>
                    <span class="choice-help">Save a draft sales order.</span>
                  </span>
                </label>
              </div>
              <p id="dest-hint" class="hint" hidden>Choose the spreadsheet, Zoho Books, or both.</p>
            </div>
            <button type="submit" id="submit" class="primary">
              <span id="submit-spin" class="spin" hidden></span>
              <span id="submit-label">Submit</span>
            </button>
          </div>
          <div id="result" class="banner" role="status" hidden></div>
        </form>
      </div>
    </section>
  </div>
  <script src="/static/app.js?v=23"></script>
</body>
</html>
