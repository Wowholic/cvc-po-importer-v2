<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CVC - Order Entry</title>
  <link rel="icon" href="/static/favicon.ico?v=1">
  <link rel="stylesheet" href="/static/app.css?v=29">
</head>
<body>
  <header class="top">
    <a class="brand" href="/login">
      <img class="logo" src="/static/cvc-logo.png?v=1" alt="CVC Valves">
      <h1 class="name">Order Entry</h1>
    </a>
  </header>

  <main class="shell">
    <form class="login" method="post" action="/login">
      <h2>Sign in</h2>
      {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}
      <label class="field">
        <span>User</span>
        <input name="user" autocomplete="username" required {% if not ready %}disabled{% endif %}>
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required {% if not ready %}disabled{% endif %}>
      </label>
      <button class="primary" type="submit" {% if not ready %}disabled{% endif %}>Sign in</button>
    </form>
  </main>
</body>
</html>
